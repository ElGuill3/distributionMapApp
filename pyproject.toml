[project]
name = "distributionmapapp"
version = "0.1.0"
description = "Web app and scraper for distribution mapping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask",
    "Flask-Limiter",
    "earthengine-api",
    "pandas",
    "numpy",
    "Pillow",
    "requests",
    "Jinja2>=3.0",
    "pytest",
    "pydantic>=2.0",
    "PyYAML",
    "apscheduler",
    "python-dotenv",
    "beautifulsoup4",
]

[project.scripts]
distribution-map = "backend.scripts.run_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["backend/__init__.py", "backend/scripts"]

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.7.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
floodmodel = [
    "lightgbm>=4.3",
    "pyogrio>=0.7",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "scikit-learn>=1.4",
    "shapely>=2.0",
    "whitebox>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
