  /api/flood-risk/metadata:
    get:
      operationId: getFloodRiskMetadata
      summary: Flood susceptibility map metadata
      description: 'Classes, palette, XYZ tile template, bounds, data sources and
        held-out validation scores of the published statewide flood susceptibility
        map. The map is produced offline by `python -m backend.floodmodel publish`.

        '
      tags:
      - Flood Risk
      responses:
        '200':
          description: Map metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: integer
                        label:
                          type: string
                        color:
                          type: string
                  tiles:
                    type: object
                    properties:
                      url:
                        type: string
                        example: /api/flood-risk/tiles/{z}/{x}/{y}.png
                      minzoom:
                        type: integer
                      maxzoom:
                        type: integer
                  bounds:
                    type: array
                    items:
                      type: number
                  sources:
                    type: array
                    items:
                      type: string
        '503':
          description: The published map is missing or unreadable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-cache-policy:
        max_age: 86400
        etag: false
  /api/flood-risk/municipalities:
    get:
      operationId: getFloodRiskMunicipalities
      summary: Municipality flood susceptibility statistics
      description: 'GeoJSON FeatureCollection of the 17 municipalities of Tabasco
        with area, share of each susceptibility class, share of high or very high
        susceptibility, mean score and statewide rank.

        '
      tags:
      - Flood Risk
      responses:
        '200':
          description: Municipalities with statistics.
          content:
            application/geo+json:
              schema:
                type: object
      x-cache-policy:
        max_age: 86400
        etag: false
  /api/flood-risk/tiles/{z}/{x}/{y}.png:
    get:
      operationId: getFloodRiskTile
      summary: Flood susceptibility XYZ tile
      description: 'Pre-rendered paletted PNG tile (Web Mercator, zoom 7-12). Pixel
        colours match the metadata classes; transparent pixels have no data. Not
        rate limited.

        '
      tags:
      - Flood Risk
      parameters:
      - name: z
        in: path
        required: true
        schema:
          type: integer
      - name: x
        in: path
        required: true
        schema:
          type: integer
      - name: y
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: PNG tile.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Tile outside the published set.
      x-cache-policy:
        max_age: 86400
        etag: false
  /api/flood-detection:
    get:
      operationId: getFloodDetection
      summary: Flood detection layers for a bounding box
      description: 'Classify water with Sentinel-1 (VH backscatter) or Landsat (MNDWI)
        over the period and return Earth Engine tile URL templates for Leaflet plus
        the threshold used. Permanent water and steep slopes are masked.

        '
      tags:
      - Flood Detection
      parameters:
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD).
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date
        description: End date (YYYY-MM-DD), after start.
      - name: bbox
        in: query
        required: true
        schema:
          type: string
        description: Bounding box "min_lon,min_lat,max_lon,max_lat" (WGS 84).
      - name: satellite
        in: query
        required: false
        schema:
          type: string
          enum:
          - sentinel1
          - landsat
          default: sentinel1
        description: Sensor used to classify water.
      - name: auto
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Compute the classification threshold automatically.
      - name: threshold
        in: query
        required: false
        schema:
          type: number
          default: -18.0
        description: Manual threshold (VH backscatter in dB for Sentinel-1) used when auto is false.
      responses:
        '200':
          description: Tile layers and threshold.
          content:
            application/json:
              schema:
                type: object
                properties:
                  satellite:
                    type: string
                  computed_threshold:
                    type: number
                  background_layer:
                    type: string
                    description: Earth Engine XYZ tile URL template for the background image.
                  water_layer:
                    type: string
                    description: Earth Engine XYZ tile URL template for detected water.
        '400':
          description: Missing or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No images for this area and period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-rate-limit: 60/minute
  /api/flood-stats:
    get:
      operationId: getFloodStats
      summary: Flooded area for a bounding box
      description: 'Same classification as /api/flood-detection, reduced to the total
        flooded area in hectares.

        '
      tags:
      - Flood Detection
      parameters:
