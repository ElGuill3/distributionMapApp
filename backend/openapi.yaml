  /api/ndvi-timeseries-bbox:
    get:
      operationId: getNdviTimeseriesBbox
      summary: NDVI timeseries
      description: 'Get NDVI (MODIS MOD13Q1) time-series values for the given bounding
        box. The `year` and `season` parameters are resolved internally; only `start`
        and `end` are exposed as query parameters.

        '
      tags:
      - Timeseries
      parameters:
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD).
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date
        description: End date (YYYY-MM-DD).
      - name: bbox
