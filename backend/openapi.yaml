        in: query
        required: true
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD).
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date
        description: End date (YYYY-MM-DD), after start.
      - name: bbox
        in: query
        required: true
        schema:
          type: string
        description: Bounding box "min_lon,min_lat,max_lon,max_lat" (WGS 84).
      - name: satellite
        in: query
        required: false
        schema:
          type: string
          enum:
          - sentinel1
          - landsat
          default: sentinel1
        description: Sensor used to classify water.
      - name: auto
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Compute the classification threshold automatically.
      - name: threshold
        in: query
        required: false
        schema:
          type: number
          default: -18.0
        description: Manual threshold (VH backscatter in dB for Sentinel-1) used when auto is false.
      responses:
        '200':
          description: Flooded area.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_ha:
                    type: number
                    description: Flooded area in hectares (2 decimals).
        '400':
          description: Missing or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-rate-limit: 30/minute
  /api/local-stations:
    get:
      operationId: getLocalStations
      summary: Local station metadata
      description: 'Metadata of every configured local station, keyed by station id
        (for example "BDCTB_hidro").

        '
      tags:
      - Station
      responses:
        '200':
          description: Stations keyed by id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                    coords:
                      type:
                      - array
                      - 'null'
                      items:
                        type: number
                    station_name:
                      type:
                      - string
                      - 'null'
                    municipio:
                      type:
                      - string
                      - 'null'
      x-rate-limit: 60/minute
      x-cache-policy:
        max_age: 600
        etag: true
  /api/local-station-level-range:
    get:
      operationId: getLocalStationLevelRange
      summary: Local station water level timeseries
      description: 'Get hydrometric level data for a local station within a date range.
        Supported stations: SPTTB (San Pedro, Balancán) and BDCTB (Boca del Cerro,
        Tenosique).

        '
      tags:
      - Station
      parameters:
      - name: station
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/StationQuerySchema/properties/station_id'
        description: Station ID — "SPTTB" or "BDCTB".
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD).
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date
        description: End date (YYYY-MM-DD).
      responses:
        '200':
          description: Station level data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  station:
                    type: string
                    description: Station ID.
                  dates:
                    type: array
                    items:
                      type: string
                  level_m:
                    type: array
                    items:
                      type:
                      - number
                      - 'null'
                    description: Water level in meters, null for missing data.
        '400':
          description: Invalid parameters or station ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-rate-limit: 60/minute
      x-cache-policy:
        max_age: 600
        etag: true
  /api/gif-progress/{task_id}:
    get:
      operationId: getGifProgress
      summary: SSE progress for GIF generation
      description: 'Server-Sent Events endpoint that streams progress updates for
        a GIF generation task. The client opens an `EventSource` connection and receives
        JSON events with `{ "progress": <0-100|-1>, "message": "..." }`.

        The connection auto-closes when `progress` reaches **100** (complete) or **-1**
        (error). If the task ID is not found, a single error event is sent and the
        connection closes.

        '
      tags:
      - SSE
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
        description: Task ID previously passed to a GIF endpoint.
      responses:
        '200':
          description: SSE stream of progress events.
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  progress:
                    type: integer
                    description: Progress percentage (0-100) or -1 on error.
                  message:
                    type: string
                    description: Human-readable status message.
              example:
                data: '{"progress": 42, "message": "Descargando GIF de GEE..."}'
        '400':
          description: Invalid task_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-cache-policy:
        max_age: 0
        etag: false
  /api/export/bundle:
    post:
      operationId: postExportBundle
      summary: Export analysis as ZIP
      description: 'Generate and download a ZIP bundle containing timeseries CSV,
        optional GIF animations, and metadata.json.

        '
      tags:
      - Export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequestSchema'
      responses:
        '200':
          description: ZIP bundle with analysis data.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="analysis_export_YYYYMMDD_HHMMSS.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid request body or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: One or more GIF paths not found on disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the client should retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-rate-limit: 10/minute
      x-cache-policy:
        max_age: 0
        etag: false
  /api/v1/forecasts/bdctb:
    get:
      operationId: getBdctbForecast
      summary: Latest published BDCTB modeled forecast with offline cache
      description: >-
        Fetches and validates bdctb-forecast/v2 (64 KiB cap, connect/read timeouts
        2/5 seconds, no redirects). On failure returns the last valid disk copy;
        returns 503 only when neither source is valid. With a server-side messenger
        token, a request can start a nonblocking IPCET image upload to the forecasts
        branch. No model or OCR runs in this app. Updating remains true during
        upload and for at most 30 minutes afterwards until today's live input
        arrives. Clients may poll every 60 seconds for up to 30 minutes.
        All responses use Cache-Control no-store.
      tags:
      - Forecast
      responses:
        '200':
          description: Strict modeled forecast with ordered h1/h3/h7 quantiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BdctbForecastResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: No valid cached forecast is currently available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BdctbForecastUnavailableResponse'
      x-rate-limit: 60/minute
      x-cache-policy:
        max_age: 0
        etag: false
  /api/v1/ipcet/levels:
    get:
      operationId: getIpcetLevels
      summary: Latest official IPCET table and semáforo
      description: >-
        Read-only ipcet-levels/v1 proxy, not a modeled forecast. Validates all
        fields and finite numbers before saving. Fetch has a 3.5 second total
        deadline, a 1 MiB cap and no redirects. Falls back to the last valid disk
        copy, without starting an upload. All responses use Cache-Control no-store.
      tags: [Station]
      responses:
        '200':
          description: Official publication plus source (network or cache).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpcetLevelsResponse'
        '429':
          description: Rate limit exceeded (RATE_LIMIT_FORECAST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Neither network nor disk has a valid publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-rate-limit: 60/minute
      x-cache-policy: {max_age: 0, etag: false}
  /api/v1/ipcet/levels/{code}/recent:
    get:
      operationId: getIpcetRecent
      summary: Recent official observations for any published station code
      description: >-
        Read-only ipcet-recent/v1 proxy with the same deadline, validation and
        disk fallback as the latest table. Preserves publication shape but filters
        stations to the requested code. Dates are ascending, at most 30 per station.
        Null hoy denotes an unconfirmed level; null semaforo is allowed for seeded
        history. A malformed code is rejected before fetching. No messenger upload.
        All responses use Cache-Control no-store.
      tags: [Station]
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string, pattern: '^[A-Z]{5}$'}
      responses:
        '200':
          description: Publication containing only the requested station, plus source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpcetRecentResponse'
        '404':
          description: Unknown or malformed station code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (RATE_LIMIT_FORECAST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Neither network nor disk has a valid publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-rate-limit: 60/minute
      x-cache-policy: {max_age: 0, etag: false}
components:
  schemas:
    IpcetState:
      enum: [NORMAL, A LA BAJA, BAJO, PREVENCION, ALERTA, EMERGENCIA, null]
    IpcetLevel:
      type: [number, 'null']
      description: Finite metres as printed, or null; never repaired.
    IpcetLevelsResponse:
      type: object
      additionalProperties: false
      required: [schema, table_date, issued_at, last_modified, source_url, stations, source]
      properties:
        schema: {const: ipcet-levels/v1}
        table_date: {type: string, format: date}
        issued_at: {type: string, format: date-time}
        last_modified: {type: string}
        source_url: {type: [string, 'null']}
        source: {enum: [network, cache]}
        stations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, river, station, namo, namino, ayer, hoy, diff, capacity, semaforo, problems]
            properties:
              code: {type: [string, 'null'], pattern: '^[A-Z]{5}$'}
              river: {type: string}
              station: {type: string}
              namo: {$ref: '#/components/schemas/IpcetLevel'}
              namino: {$ref: '#/components/schemas/IpcetLevel'}
              ayer: {$ref: '#/components/schemas/IpcetLevel'}
              hoy: {$ref: '#/components/schemas/IpcetLevel'}
              diff: {$ref: '#/components/schemas/IpcetLevel'}
              capacity: {$ref: '#/components/schemas/IpcetLevel'}
              semaforo: {$ref: '#/components/schemas/IpcetState'}
              problems:
                type: array
                description: Official state remains usable; levels with problems are unconfirmed.
                items: {type: string}
    IpcetRecentResponse:
      type: object
      additionalProperties: false
      required: [schema, stations, source]
      properties:
        schema: {const: ipcet-recent/v1}
        source: {enum: [network, cache]}
        stations:
          type: object
          minProperties: 1
          maxProperties: 1
          propertyNames: {pattern: '^[A-Z]{5}$'}
          additionalProperties:
            type: array
            maxItems: 30
            items:
              type: object
              additionalProperties: false
              required: [date, hoy, semaforo]
              properties:
                date: {type: string, format: date}
                hoy: {$ref: '#/components/schemas/IpcetLevel'}
                semaforo: {$ref: '#/components/schemas/IpcetState'}
    BBoxSchema:
      description: Schema para validar bounding boxes geográficos.
      properties:
        min_lon:
          maximum: 180.0
          minimum: -180.0
          title: Min Lon
          type: number
        min_lat:
          maximum: 90.0
          minimum: -90.0
          title: Min Lat
          type: number
        max_lon:
          maximum: 180.0
          minimum: -180.0
          title: Max Lon
          type: number
        max_lat:
          maximum: 90.0
          minimum: -90.0
          title: Max Lat
          type: number
      required:
      - min_lon
      - min_lat
      - max_lon
      - max_lat
      title: BBoxSchema
      type: object
    DateRangeSchema:
      description: Schema para validar rangos de fecha.
      properties:
        start:
          format: date
          title: Start
          type: string
        end:
          format: date
          title: End
          type: string
      required:
      - start
      - end
      title: DateRangeSchema
      type: object
    StationQuerySchema:
      description: Schema para endpoints de estaciones hidrológicas.
      properties:
        station_id:
          enum:
          - SPTTB
          - BDCTB
          title: Station Id
          type: string
        start:
          format: date
          title: Start
          type: string
        end:
          format: date
          title: End
          type: string
      required:
      - station_id
      - start
      - end
      title: StationQuerySchema
      type: object
    ExportRequestSchema:
      description: 'Schema para validar peticiones al endpoint de export bundle.


        gifPaths: rutas relativas a STATIC_DIR ej: ["gifs/ndvi_abc123.gif"]

        seriesData: dict con dates (lista de YYYY-MM-DD) y variables (keyed por nombre)

        bbox: [minLon, minLat, maxLon, maxLat]

        metadata: variableKeys'
      properties:
        gifPaths:
          description: GIF files confined to gifs/; optional /static/ prefix. Traversal,
            absolute paths, non-GIF files and symlink escapes are rejected.
          items:
            type: string
          title: Gifpaths
          type: array
        seriesData:
          $ref: '#/components/schemas/SeriesDataSchema'
        bbox:
          examples:
          - - -92.5
            - 17.0
            - -91.0
            - 18.0
          items:
            type: number
          title: Bbox
          type: array
        metadata:
          $ref: '#/components/schemas/ExportBundleMetadataSchema'
      required:
      - seriesData
      - bbox
      - metadata
      title: ExportRequestSchema
      type: object
    ExportBundleMetadataSchema:
      description: Schema para metadatos específicos del export ZIP.
      properties:
        variableKeys:
          items:
            type: string
          title: Variablekeys
          type: array
      required:
      - variableKeys
      title: ExportBundleMetadataSchema
      type: object
    SeriesDataSchema:
      description: Schema para datos de series temporales en petición de exportación.
      properties:
        dates:
          items:
            type: string
          minItems: 1
          title: Dates
          type: array
        variables:
          additionalProperties:
            items:
              anyOf:
              - type: number
              - type: 'null'
            type: array
          title: Variables
          type: object
      required:
      - dates
      title: SeriesDataSchema
      type: object
    ExportMetadataSchema:
      description: Schema para metadatos de exportación.
      properties:
        variableKeys:
          items:
            type: string
          title: Variablekeys
          type: array
      required:
      - variableKeys
      title: ExportMetadataSchema
      type: object
    BdctbForecastResponse:
      type: object
      additionalProperties: false
      required: [forecast, source, fetched_at, updating]
      properties:
        forecast:
          $ref: '#/components/schemas/BdctbForecast'
        source:
          type: string
          enum: [network, cache]
        fetched_at:
          type: string
          format: date-time
          description: Time the valid publication was retrieved (preserved on cache fallback).
        updating:
          type: boolean
          description: IPCET messenger is uploading or waiting for publication (30 minute cap).
    BdctbForecast:
      type: object
      additionalProperties: false
      required: [schema, station, issue_time, generated_at, model_version, mode, live_input, forecasts, disclaimer]
      description: >-
        Modeled stage in metres on the SIH/IPCET datum, never an observation or
        official warning. Live mode requires a live_input aged 0-7 days inclusive;
        glofas_only requires null. Target dates equal the Mexico City issue date
        plus the horizon. Quantiles are finite and ordered q10 <= q50 <= q90.
      properties:
        schema:
          type: string
          const: bdctb-forecast/v2
        station:
          type: object
          additionalProperties: false
          required: [code, name]
          properties:
            code:
              type: string
              const: BDCTB
            name:
              type: string
              const: Boca del Cerro
        issue_time:
          type: string
          format: date-time
          description: 11:00 America/Mexico_City, with timezone offset.
        generated_at:
          type: string
          format: date-time
          description: Actual publication run time, with timezone offset.
        model_version:
          type: string
          minLength: 1
        mode:
          type: string
          enum: [live, glofas_only]
        live_input:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required: [date, stage_m, age_days]
            properties:
              date:
                type: string
                format: date
              stage_m:
                type: number
              age_days:
                type: integer
                minimum: 0
                maximum: 7
        forecasts:
          type: object
          additionalProperties: false
          required: [h1, h3, h7]
          properties:
            h1:
              $ref: '#/components/schemas/BdctbForecastPoint'
            h3:
              $ref: '#/components/schemas/BdctbForecastPoint'
            h7:
              $ref: '#/components/schemas/BdctbForecastPoint'
        disclaimer:
          type: string
          const: Pronóstico modelado, no es una observación ni un aviso oficial. Consulte el semáforo oficial de IPCET.
      oneOf:
      - properties:
          mode:
            const: live
          live_input:
            type: object
      - properties:
          mode:
            const: glofas_only
          live_input:
            type: 'null'
    BdctbForecastPoint:
      type: object
      additionalProperties: false
      required: [target_date, q10, q50, q90, distance_to_namo_m, namo_m, data_kind]
      properties:
        target_date:
          type: string
          format: date
        q10:
          type: number
        q50:
          type: number
        q90:
          type: number
        distance_to_namo_m:
          type: number
          description: q50 minus 19.21, positive above NAMO.
        namo_m:
          type: number
          const: 19.21
        data_kind:
          type: string
          const: modeled_not_observed
    BdctbForecastUnavailableResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          const: No hay un pronóstico válido guardado. Intente de nuevo cuando haya conexión.
    ErrorResponse:
      type: object
      description: Standard error response format.
      properties:
        error:
          type: string
          description: Human-readable error message.
      required:
      - error
